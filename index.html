<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SportsBot">
<meta name="theme-color" content="#0b0f17">
<title>SportsBot Upsets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🏈</span><div><h1>SportsBot</h1><p>NFL + NCAA upset finder</p></div></div>
  <button id="refresh" aria-label="Refresh">↻</button>
</header>

<nav class="controls">
  <div class="seg" id="leagueSeg">
    <button data-v="all" class="on">All</button><button data-v="nfl">NFL</button><button data-v="ncaa">NCAA</button>
  </div>
  <div class="seg" id="viewSeg">
    <button data-v="picks" class="on">Upset picks</button><button data-v="all">All games</button>
  </div>
  <div class="seg" id="daySeg">
    <button data-v="week" class="on">All week</button><button data-v="today">Today</button>
  </div>
  <div class="weeknav"><button id="prev">‹</button><span id="week">This week</span><button id="next">›</button></div>
</nav>

<p id="status" class="status"></p>
<main id="list"></main>

<footer class="foot">
  Data: ESPN public scoreboard, betting lines and FPI. Upset chance blends Vegas-implied odds with ESPN FPI plus
  situational factors (home dog, records, rankings, low totals). For entertainment — not betting advice.
</footer>

<script src="upset.js"></script>
<script src="app.js"></script>
</body>
</html>
